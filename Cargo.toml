[package]
name = "discord-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { git = "https://github.com/serenity-rs/serenity", rev = "a265dcc", default-features = false, features = [
    "cache",
    "gateway",
    "rustls_backend",
    "model",
    "unstable",
] }
sysinfo = "0.40.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = "line-tables-only"
